services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      OWNER_INVITE_TTL: ${OWNER_INVITE_TTL:-7d}
      STAFF_INVITE_TTL: ${STAFF_INVITE_TTL:-7d}
      ORDER_HOLD_HOURS: ${ORDER_HOLD_HOURS:-24}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET}
      PLATFORM_ACCESS_TOKEN_TTL: ${PLATFORM_ACCESS_TOKEN_TTL:-15m}
      PLATFORM_REFRESH_TOKEN_TTL: ${PLATFORM_REFRESH_TOKEN_TTL:-7d}
      BUSINESS_SELECTION_TTL: ${BUSINESS_SELECTION_TTL:-10m}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Inventory Manager}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      SEED_PLATFORM_ADMIN_EMAIL: ${SEED_PLATFORM_ADMIN_EMAIL}
      SEED_PLATFORM_ADMIN_PHONE: ${SEED_PLATFORM_ADMIN_PHONE:-}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD}
    volumes:
      - product_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
      - dokploy-network

volumes:
  product_uploads:

networks:
  dokploy-network:
    external: true
